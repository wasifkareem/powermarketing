<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="3in" height="2in" role="img" aria-label="Illustration: two analysts discovering glowing keywords with a giant magnifying net">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="sp" d="M0 -16Q3 -3 16 0Q3 3 0 16Q-3 3 -16 0Q-3 -3 0 -16Z" fill="#F38DF6" stroke="none">
      <animateTransform attributeName="transform" type="scale" values="1; 1.5; 1" dur="2s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="1; 0.4; 1" dur="2s" repeatCount="indefinite" />
    </path>
  </defs>
  <g filter="url(#wob)" stroke="#F38DF6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- soft backdrop blob -->
    <path d="M150 180C280 80 950 120 1080 200C1180 260 1150 550 1060 620C920 720 280 700 160 620C80 560 50 250 150 180Z" fill="#1E0822" stroke="none"/>

    <!-- Giant Search Bar Floating -->
    <rect x="250" y="250" width="700" height="120" rx="60" fill="#140518" stroke-width="8"/>
    <!-- Search Magnifier Icon inside bar -->
    <circle cx="330" cy="310" r="24" stroke="#8A2A8E" stroke-width="8"/>
    <path d="M347 327L370 350" stroke="#8A2A8E" stroke-width="12"/>
    <!-- Keywords floating out -->
    <rect x="400" y="280" width="180" height="60" rx="30" fill="#F38DF6" stroke="none"/>
    <path d="M440 310H540" stroke="#FFE8FD" stroke-width="8"/>

    <rect x="620" y="280" width="120" height="60" rx="30" fill="none" stroke="#8A2A8E" stroke-width="6"/>
    <path d="M650 310H710" stroke="#8A2A8E" stroke-width="8"/>

    <!-- Ground -->
    <path d="M60 640H1140" stroke-width="6"/>

    <!-- Floating Keys and Sparkles -->
    <!-- Key 1 -->
    <circle cx="850" cy="180" r="16" stroke="#F38DF6" stroke-width="6"/>
    <path d="M866 180H930" stroke="#F38DF6" stroke-width="6"/>
    <path d="M890 180V200 M910 180V200" stroke="#F38DF6" stroke-width="6"/>

    <!-- ANALYST 1 (Left) holding a giant butterfly net / key catcher -->
    <g fill="#F38DF6" stroke="none">
      <!-- Hair/Head mass -->
      <circle cx="160" cy="300" r="30"/>
      <circle cx="200" cy="280" r="35"/>
      <circle cx="230" cy="300" r="25"/>
      <circle cx="180" cy="340" r="30"/>
    </g>
    <rect x="180" y="420" width="40" height="60" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="5"/>
    <path d="M120 640L140 500C150 460 210 460 220 500L240 640Z" fill="#F38DF6" stroke="#2B0A2E" stroke-width="5"/>
    <!-- Head -->
    <path d="M160 380C150 320 210 320 220 380C220 420 160 420 160 380Z" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="6"/>
    <!-- Face -->
    <path d="M185 345H195 M210 345H220" stroke="#2B0A2E" stroke-width="4"/>
    <circle cx="190" cy="355" r="4" fill="#2B0A2E" stroke="none"/>
    <circle cx="215" cy="355" r="4" fill="#2B0A2E" stroke="none"/>
    <path d="M190 380Q202 395 215 375" stroke="#2B0A2E" stroke-width="5"/>
    
    <!-- Arm swinging net -->
    <path d="M220 470Q280 440 320 380" stroke="#2B0A2E" stroke-width="24"/>
    <path d="M220 470Q280 440 320 380" stroke="#F38DF6" stroke-width="16"/>
    <!-- Net Pole -->
    <path d="M260 480L450 180" stroke="#140518" stroke-width="8"/>
    <!-- Net hoop & bag -->
    <ellipse cx="450" cy="180" rx="40" ry="100" transform="rotate(30 450 180)" fill="none" stroke="#F38DF6" stroke-width="8"/>
    <path d="M470 110C600 150 550 250 410 240" fill="none" stroke="#8A2A8E" stroke-width="4" stroke-dasharray="8 8"/>

    <!-- STRATEGIST 2 (Right) looking at a glowing extracted keyword -->
    <!-- Head -->
    <path d="M980 280C960 280 960 250 980 250C1000 250 1000 280 980 280Z" fill="#F38DF6" stroke="none"/> <!-- Top knot -->
    <path d="M940 380C930 310 1010 310 1010 380C1010 430 940 430 940 380Z" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="6"/>
    <!-- Face (Profile looking left) -->
    <path d="M945 365L930 375L942 385" stroke="#2B0A2E" stroke-width="4"/> <!-- Nose -->
    <circle cx="955" cy="355" r="4" fill="#2B0A2E" stroke="none"/>
    <path d="M950 400Q960 410 970 400" stroke="#2B0A2E" stroke-width="4"/>
    
    <rect x="955" y="420" width="30" height="50" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="5"/>
    <path d="M1020 640L1000 500C990 460 930 460 920 500L900 640Z" fill="#8A2A8E" stroke="#2B0A2E" stroke-width="5"/>

    <!-- Arm holding the keyword -->
    <path d="M955 480Q880 480 820 420" stroke="#2B0A2E" stroke-width="24"/>
    <path d="M955 480Q880 480 820 420" stroke="#FFE8FD" stroke-width="16"/>
    
    <!-- Held Keyword (Glowing) -->
    <rect x="680" y="380" width="160" height="50" rx="25" fill="#FFE8FD" stroke="#F38DF6" stroke-width="8"/>
    <path d="M720 405H800" stroke="#F38DF6" stroke-width="8"/>
    
    <!-- Sparkles -->
    <use href="#sp" transform="translate(680 370) scale(1.2)"/>
    <use href="#sp" transform="translate(850 430) scale(0.8)"/>
    <use href="#sp" transform="translate(450 100) scale(1.5)"/>
    <use href="#sp" transform="translate(300 200) scale(0.7)"/>
    
    <!-- Random Confetti -->
    <circle cx="200" cy="200" r="6" fill="#F38DF6" stroke="none"/>
    <circle cx="1000" cy="150" r="8" fill="#F38DF6" stroke="none"/>
    <circle cx="800" cy="550" r="5" fill="#8A2A8E" stroke="none"/>

  </g>
</svg>
