<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="3in" height="2in" role="img" aria-label="Illustration: two analysts comparing competitor bars on a market chart and pointing at an uncontested gap">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <g id="q">
      <animateTransform attributeName="transform" type="rotate" values="-5; 5; -5" dur="3s" repeatCount="indefinite" additive="sum"/>
      <path d="M4 14C4 -6 30 -8 30 12C30 26 16 28 16 40" fill="none" stroke-width="6" stroke-linecap="round"/>
      <circle cx="16" cy="54" r="4.5" fill="#F38DF6" stroke="none"/>
    </g>
    <path id="sp" d="M0 -16Q3 -3 16 0Q3 3 0 16Q-3 3 -16 0Q-3 -3 0 -16Z" fill="#F38DF6" stroke="none">
      <animateTransform attributeName="transform" type="scale" values="1; 1.5; 1" dur="2s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="1; 0.4; 1" dur="2s" repeatCount="indefinite" />
    </path>
  </defs>

  <g filter="url(#wob)" stroke="#F38DF6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- soft backdrop blob -->
    <path d="M120 200C200 90 1000 60 1110 170C1180 240 1160 520 1080 600C980 680 240 700 130 600C60 520 50 290 120 200Z" fill="#1E0822" stroke="none"/>

    <!-- monitor stand -->
    <rect x="600" y="576" width="60" height="44" fill="#140518"/>
    <rect x="538" y="620" width="184" height="20" rx="10" fill="#140518"/>

    <!-- market chart board -->
    <rect x="400" y="250" width="420" height="330" rx="24" fill="#140518" stroke-width="8"/>
    <path d="M430 320H800M430 380H800M430 440H800M430 500H800" stroke="#3A1140" stroke-width="3" stroke-dasharray="2 10"/>
    <path d="M452 300V552H800" stroke-width="6"/>

    <!-- competitor bars -->
    <rect x="472" y="472" width="40" height="80" rx="4" fill="#8A2A8E" stroke-width="4"/>
    <rect x="528" y="412" width="40" height="140" rx="4" fill="#8A2A8E" stroke-width="4"/>
    <rect x="584" y="440" width="40" height="112" rx="4" fill="#8A2A8E" stroke-width="4"/>
    <!-- the uncontested gap -->
    <rect x="640" y="352" width="40" height="200" rx="4" fill="none" stroke-width="4" stroke-dasharray="10 8"/>
    <!-- our bar -->
    <rect x="696" y="376" width="40" height="176" rx="4" fill="#F38DF6" stroke-width="4"/>
    <rect x="752" y="428" width="40" height="124" rx="4" fill="#8A2A8E" stroke-width="4"/>

    <!-- opportunity arrow -->
    <path d="M492 440C530 392 572 366 630 364" stroke="#FFE8FD" stroke-width="4" stroke-dasharray="4 10"/>
    <polygon points="642,364 624,354 624,374" fill="#FFE8FD" stroke="none"/>
    <use href="#q" transform="translate(644 294) scale(0.9)" stroke="#F38DF6" stroke-width="6"/>

    <!-- ground -->
    <path d="M60 640H1140" stroke-width="6"/>

    <!-- plant -->
    <path d="M1112 600H1172L1162 640H1122Z" fill="none"/>
    <path d="M1142 600C1124 540 1128 470 1138 420C1152 480 1156 540 1142 600Z" fill="#8A2A8E"/>
    <path d="M1130 600C1108 560 1100 510 1104 480C1124 510 1132 560 1130 600Z" fill="#8A2A8E"/>
    <path d="M1152 600C1170 550 1176 500 1186 470C1190 520 1176 570 1158 600Z" fill="#8A2A8E"/>

    <!-- ANALYST (left) -->
    <g fill="#F38DF6" stroke="none">
      <circle cx="176" cy="330" r="30"/>
      <circle cx="200" cy="292" r="34"/>
      <circle cx="248" cy="276" r="34"/>
      <circle cx="292" cy="296" r="30"/>
      <circle cx="304" cy="340" r="24"/>
      <circle cx="166" cy="366" r="22"/>
    </g>
    <rect x="214" y="420" width="36" height="52" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="5"/>
    <path d="M158 640L164 512C170 478 198 462 232 462C266 462 296 478 302 512L308 640Z" fill="#F38DF6" stroke="#2B0A2E" stroke-width="5"/>
    <path d="M212 466L232 494L252 466" stroke="#2B0A2E" stroke-width="5"/>
    <circle cx="176" cy="380" r="12" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="5"/>
    <circle cx="292" cy="380" r="12" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="5"/>
    <path d="M178 384C172 322 198 290 234 292C270 294 294 324 290 384C287 420 268 446 232 446C196 446 181 418 178 384Z" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="6"/>
    <circle cx="213" cy="366" r="16" stroke="#2B0A2E" stroke-width="5"/>
    <circle cx="252" cy="366" r="16" stroke="#2B0A2E" stroke-width="5"/>
    <path d="M229 366H236" stroke="#2B0A2E" stroke-width="5"/>
    <circle cx="213" cy="368" r="4" fill="#2B0A2E" stroke="none"/>
    <circle cx="252" cy="368" r="4" fill="#2B0A2E" stroke="none"/>
    <path d="M198 336Q211 330 224 336M240 336Q253 330 266 336" stroke="#2B0A2E" stroke-width="4"/>
    <path d="M220 414Q233 424 248 412" stroke="#2B0A2E" stroke-width="5"/>

    <!-- analyst arm + magnifier -->
    <path d="M280 512Q300 532 312 540" stroke="#2B0A2E" stroke-width="28"/>
    <path d="M280 512Q300 532 312 540" stroke="#F38DF6" stroke-width="20"/>
    <path d="M322 538L342 506" stroke="#2B0A2E" stroke-width="16"/>
    <path d="M322 538L342 506" stroke="#F38DF6" stroke-width="9"/>
    <circle cx="316" cy="542" r="13" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="5"/>
    <circle cx="372" cy="470" r="48" fill="#3A0E3E" stroke="#F38DF6" stroke-width="9"/>
    <path d="M342 452Q352 430 372 428" stroke="#FFE8FD" stroke-width="5"/>
    <rect x="352" y="486" width="10" height="12" fill="#F38DF6" stroke="none"/>
    <rect x="366" y="476" width="10" height="22" fill="#F38DF6" stroke="none"/>
    <rect x="380" y="462" width="10" height="36" fill="#F38DF6" stroke="none"/>

    <!-- STRATEGIST (right) -->
    <path d="M1080 232C1060 236 1058 206 1078 200C1098 194 1110 218 1098 232C1086 246 1062 236 1066 214" stroke-width="5"/>
    <circle cx="948" cy="350" r="12" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="5"/>
    <circle cx="1074" cy="350" r="12" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="5"/>
    <rect x="992" y="430" width="36" height="48" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="5"/>
    <path d="M940 640L946 520C950 484 976 466 1010 466C1044 466 1068 484 1072 520L1078 640Z" fill="#F38DF6" stroke="#2B0A2E" stroke-width="5"/>
    <path d="M1000 470H1020L1026 540L1010 558L994 540Z" fill="#8A2A8E" stroke="#2B0A2E" stroke-width="4"/>
    <path d="M952 384C946 300 972 252 1010 252C1048 252 1072 300 1070 384C1068 424 1046 444 1010 444C974 444 954 420 952 384Z" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="6"/>
    <path d="M990 268C1004 254 1030 254 1040 268" stroke="#2B0A2E" stroke-width="5"/>
    <circle cx="988" cy="352" r="5" fill="#2B0A2E" stroke="none"/>
    <circle cx="1034" cy="352" r="5" fill="#2B0A2E" stroke="none"/>
    <path d="M976 330L998 334M1024 334L1046 330" stroke="#2B0A2E" stroke-width="4"/>
    <path d="M990 398Q1012 410 1040 392" stroke="#2B0A2E" stroke-width="5"/>

    <!-- strategist arm pointing at the gap -->
    <path d="M948 528Q900 492 856 452" stroke="#2B0A2E" stroke-width="28"/>
    <path d="M948 528Q900 492 856 452" stroke="#F38DF6" stroke-width="20"/>
    <path d="M842 446L818 426" stroke="#2B0A2E" stroke-width="13"/>
    <path d="M842 446L818 426" stroke="#F38DF6" stroke-width="7"/>
    <circle cx="846" cy="446" r="13" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="5"/>

    <!-- thinking marks over analyst -->
    <use href="#q" transform="translate(190 186) scale(0.8)" stroke="#F38DF6" stroke-width="6"/>
    <use href="#q" transform="translate(232 160) scale(0.7)" stroke="#F38DF6" stroke-width="6"/>
    <use href="#q" transform="translate(268 190) scale(0.6)" stroke="#F38DF6" stroke-width="6"/>

    <!-- sparkles -->
    <use href="#sp" transform="translate(560 170) scale(1.1)"/>
    <use href="#sp" transform="translate(930 150) scale(0.9)"/>
    <use href="#sp" transform="translate(700 120) scale(0.6)"/>
    <use href="#sp" transform="translate(1160 300) scale(0.8)"/>
    <use href="#sp" transform="translate(110 420) scale(0.7)"/>

    <!-- keyword tag -->
    <rect x="790" y="196" width="130" height="46" rx="23" fill="none" stroke-width="5"/>
    <circle cx="814" cy="219" r="7" fill="#F38DF6" stroke="none"/>
    <path d="M834 219H898" stroke-width="5"/>

    <!-- confetti -->
    <g fill="#F38DF6" stroke="none">
      <circle cx="120" cy="300" r="5"/>
      <circle cx="1090" cy="120" r="5"/>
      <circle cx="560" cy="120" r="5"/>
      <circle cx="640" cy="118" r="4"/>
      <circle cx="1150" cy="400" r="5"/>
      <circle cx="150" cy="560" r="5"/>
    </g>
    <circle cx="1030" cy="190" r="9" stroke-width="4"/>
    <circle cx="90" cy="470" r="9" stroke-width="4"/>
  </g>
</svg>
