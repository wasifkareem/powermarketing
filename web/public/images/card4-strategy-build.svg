<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="3in" height="2in" role="img" aria-label="Illustration: two builders assembling a large website canvas out of glowing code blocks and gears">
  <defs>
    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="99" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="sp" d="M0 -16Q3 -3 16 0Q3 3 0 16Q-3 3 -16 0Q-3 -3 0 -16Z" fill="#F38DF6" stroke="none">
      <animateTransform attributeName="transform" type="scale" values="1; 1.5; 1" dur="2s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="1; 0.4; 1" dur="2s" repeatCount="indefinite" />
    </path>
    <!-- Gear definition -->
    <g id="gear">
      <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="10s" repeatCount="indefinite" additive="sum"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#8A2A8E" stroke-width="8"/>
      <circle cx="0" cy="0" r="10" fill="#8A2A8E" stroke="none"/>
      <path d="M-30 0 H -40 M 30 0 H 40 M 0 -30 V -40 M 0 30 V 40" stroke="#8A2A8E" stroke-width="8"/>
      <path d="M-21 -21 L -28 -28 M 21 21 L 28 28 M -21 21 L -28 28 M 21 -21 L 28 -28" stroke="#8A2A8E" stroke-width="8"/>
    </g>
  </defs>
  <g filter="url(#wob)" stroke="#F38DF6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Backdrop Blob -->
    <path d="M100 250C120 100 950 80 1080 180C1200 280 1150 550 1080 650C920 800 200 750 120 620C40 500 80 400 100 250Z" fill="#1E0822" stroke="none"/>

    <!-- Ground -->
    <path d="M60 680H1140" stroke-width="6"/>

    <!-- Giant Screen/Canvas being built -->
    <rect x="350" y="200" width="500" height="400" rx="20" fill="#140518" stroke="#3A1140" stroke-width="8"/>
    <!-- Header block -->
    <rect x="390" y="240" width="420" height="60" rx="15" fill="#FFE8FD" stroke="none"/>
    <circle cx="430" cy="270" r="15" fill="#2B0A2E" stroke="none"/>
    <path d="M470 270 H550" stroke="#2B0A2E" stroke-width="12"/>
    
    <!-- Content block 1 -->
    <rect x="390" y="340" width="200" height="150" rx="15" fill="#8A2A8E" stroke="none"/>
    
    <!-- Content block 2 (Floating, being carried in) -->
    <rect x="740" y="380" width="220" height="180" rx="15" fill="#F38DF6" stroke="#2B0A2E" stroke-width="8" transform="rotate(-15 740 380)"/>
    <path d="M780 430 H900 M780 470 H860" stroke="#FFE8FD" stroke-width="12" transform="rotate(-15 740 380)"/>

    <!-- Gears in the background -->
    <use href="#gear" transform="translate(300 250)"/>
    <use href="#gear" transform="translate(850 180) scale(1.5)"/>

    <!-- ANALYST 1 (Left) Welding/Working on the screen -->
    <path d="M120 680L160 520C170 480 230 480 240 520L280 680Z" fill="#8A2A8E" stroke="#2B0A2E" stroke-width="5"/>
    <circle cx="200" cy="400" r="45" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="6"/>
    <!-- Welding mask pushed up -->
    <path d="M160 380 C160 300 240 300 240 380" fill="#F38DF6" stroke="#2B0A2E" stroke-width="6"/>
    <rect x="180" y="330" width="40" height="15" fill="#140518" stroke="none"/>
    <!-- Face -->
    <circle cx="185" cy="410" r="5" fill="#2B0A2E" stroke="none"/>
    <circle cx="215" cy="410" r="5" fill="#2B0A2E" stroke="none"/>
    <path d="M190 435 H210" stroke="#2B0A2E" stroke-width="5"/>
    
    <!-- Arm using a wrench on the screen -->
    <path d="M230 520 Q320 450 370 420" stroke="#2B0A2E" stroke-width="26"/>
    <path d="M230 520 Q320 450 370 420" stroke="#8A2A8E" stroke-width="18"/>
    <!-- Wrench -->
    <path d="M350 410 L400 370" stroke="#FFE8FD" stroke-width="12"/>
    <circle cx="410" cy="360" r="15" fill="none" stroke="#FFE8FD" stroke-width="8"/>

    <!-- STRATEGIST 2 (Right) Carrying the glowing block -->
    <path d="M1080 680L1060 540C1050 500 990 500 980 540L960 680Z" fill="#F38DF6" stroke="#2B0A2E" stroke-width="5"/>
    <circle cx="1020" cy="440" r="40" fill="#FFE8FD" stroke="#2B0A2E" stroke-width="6"/>
    <!-- Glasses -->
    <circle cx="1005" cy="435" r="12" fill="none" stroke="#2B0A2E" stroke-width="4"/>
    <circle cx="1035" cy="435" r="12" fill="none" stroke="#2B0A2E" stroke-width="4"/>
    <path d="M1017 435 H1023" stroke="#2B0A2E" stroke-width="4"/>
    <path d="M1010 460 Q1020 470 1030 460" stroke="#2B0A2E" stroke-width="4"/>
    
    <!-- Arms carrying block -->
    <path d="M1000 530 Q920 540 850 480" stroke="#2B0A2E" stroke-width="26"/>
    <path d="M1000 530 Q920 540 850 480" stroke="#F38DF6" stroke-width="18"/>
    
    <path d="M1040 530 Q1080 480 1010 420" stroke="#2B0A2E" stroke-width="26"/>
    <path d="M1040 530 Q1080 480 1010 420" stroke="#F38DF6" stroke-width="18"/>

    <!-- Sparkles -->
    <use href="#sp" transform="translate(420 340) scale(1)"/>
    <use href="#sp" transform="translate(850 350) scale(1.5)"/>
    <use href="#sp" transform="translate(700 550) scale(0.8)"/>

  </g>
</svg>
